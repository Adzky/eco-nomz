spring.application.name=eco-nomz

spring.profiles.default=local

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/economz}
spring.datasource.username=${DB_USERNAME:economz_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.mvc.log-request-details=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
app.security.require-https=false

app.auth.jwt.secret=${JWT_SECRET}
app.auth.jwt.expiration=PT15M
app.auth.jwt.cookie-name=ECO_NOMZ_AUTH
app.auth.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
app.midtrans.server-key=${MIDTRANS_SERVER_KEY:}
app.midtrans.client-key=${MIDTRANS_CLIENT_KEY:}
app.midtrans.base-url=${MIDTRANS_BASE_URL:https://app.sandbox.midtrans.com}
app.midtrans.public-base-url=${MIDTRANS_PUBLIC_BASE_URL:http://localhost:8080}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8