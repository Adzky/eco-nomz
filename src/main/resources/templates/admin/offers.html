<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{admin.moderateOffers})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page-container">
    <p class="breadcrumb"><a th:href="@{/admin}" th:text="'← ' + #{admin.back}">← Administration</a></p>
    <div class="page-heading"><div><p class="eyebrow" th:text="#{admin.eyebrow}">Platform operations</p><h1 th:text="#{admin.moderateOffers}">Moderate offers</h1>
        <p th:text="#{admin.offers.intro}">Review listing details and leave a note when an offer needs attention.</p></div></div>
    <p th:if="${successMessage}" th:text="${#messages.msgOrNull(successMessage) != null ? #messages.msg(successMessage) : successMessage}" role="status"></p>
    <p class="empty-state" th:if="${offers.empty}" th:text="#{admin.offers.empty}">No offers found.</p>
    <table th:unless="${offers.empty}">
        <thead><tr><th th:text="#{market.searchLabel}">Offer</th><th th:text="#{common.restaurant}">Restaurant</th><th th:text="#{common.owner}">Owner</th><th th:text="#{common.status}">Status</th><th th:text="#{admin.moderation}">Moderation</th><th th:text="#{common.action}">Action</th></tr></thead>
        <tbody>
        <tr th:each="offer : ${offers.content}">
            <td data-label="Offer" th:attr="data-label=#{market.searchLabel}" th:text="${offer.title}"></td>
            <td data-label="Restaurant" th:attr="data-label=#{common.restaurant}" th:text="${offer.restaurantName}"></td>
            <td data-label="Owner" th:attr="data-label=#{common.owner}" th:text="${offer.ownerEmail}"></td>
            <td data-label="Status" th:attr="data-label=#{common.status}"><span class="status-badge"
                    th:text="#{${'status.' + offer.status.name()}}"></span></td>
            <td data-label="Moderation" th:attr="data-label=#{admin.moderation}">
                <span class="status-badge" th:classappend="${offer.moderated ? ' status-danger' : ''}"
                      th:text="${offer.moderated ? #messages.msg('common.hiddenByAdmin') : #messages.msg('common.visible')}"></span>
                <p class="moderation-note" th:if="${offer.moderationNote}" th:text="${offer.moderationNote}"></p>
            </td>
            <td data-label="Action" th:attr="data-label=#{common.action}">
                <form th:action="@{/admin/offers/{id}/moderation(id=${offer.id})}" method="post"
                      th:onsubmit="|return confirm('#{admin.offerConfirm}');|">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="moderated" th:value="${!offer.moderated}">
                    <label th:if="${!offer.moderated}"><span th:text="#{admin.reason}">Reason (optional)</span>
                        <input type="text" name="note" maxlength="500">
                    </label>
                    <button th:class="${offer.moderated ? 'button-secondary' : 'button-danger'}" type="submit"
                            th:text="${offer.moderated ? #messages.msg('admin.restore') : #messages.msg('admin.hide')}"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <nav th:if="${offers.totalPages > 1}" th:aria-label="#{admin.offerPages}">
        <a th:if="${offers.hasPrevious()}" th:href="@{/admin/offers(page=${offers.number - 1})}" th:text="#{common.previous}">Previous</a>
        <span><span th:text="#{common.page}">Page</span> <span th:text="${offers.number + 1}"></span> <span th:text="#{common.of}">of</span> <span th:text="${offers.totalPages}"></span></span>
        <a th:if="${offers.hasNext()}" th:href="@{/admin/offers(page=${offers.number + 1})}" th:text="#{common.next}">Next</a>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
