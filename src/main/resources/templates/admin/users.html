<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{admin.manageAccounts})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page-container">
    <p class="breadcrumb"><a th:href="@{/admin}" th:text="'← ' + #{admin.back}">← Administration</a></p>
    <div class="page-heading"><div><p class="eyebrow" th:text="#{admin.eyebrow}">Platform operations</p><h1 th:text="#{admin.manageAccounts}">Manage accounts</h1>
        <p th:text="#{admin.accounts.intro}">Review access status and account details. Administrator access is managed out of band.</p></div></div>
    <p th:if="${successMessage}" th:text="${#messages.msgOrNull(successMessage) != null ? #messages.msg(successMessage) : successMessage}" role="status"></p>
    <p class="empty-state" th:if="${users.empty}" th:text="#{admin.accounts.empty}">No accounts found.</p>
    <table th:unless="${users.empty}">
        <thead><tr><th th:text="#{common.name}">Name</th><th th:text="#{common.email}">Email</th><th th:text="#{admin.role}">Role</th><th th:text="#{admin.status}">Status</th><th th:text="#{common.created}">Created</th><th th:text="#{common.action}">Action</th></tr></thead>
        <tbody>
        <tr th:each="user : ${users.content}">
            <td data-label="Name" th:text="${user.name}"></td>
            <td data-label="Email" th:text="${user.email}"></td>
            <td data-label="Role" th:attr="data-label=#{admin.role}" th:text="#{${'role.' + user.role.name()}}"></td>
            <td data-label="Status" th:attr="data-label=#{admin.status}"><span class="status-badge" th:classappend="${!user.active ? ' status-danger' : ''}"
                    th:text="${user.active ? #messages.msg('admin.active') : #messages.msg('admin.suspended')}"></span></td>
            <td data-label="Created" th:attr="data-label=#{common.created}" th:text="${user.createdAt}"></td>
            <td data-label="Action" th:attr="data-label=#{common.action}">
                <form th:if="${user.role.name() != 'ADMIN'}"
                      th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post"
                      th:onsubmit="|return confirm('#{admin.accountConfirm}');|">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="active" th:value="${!user.active}">
                    <button th:class="${user.active ? 'button-danger' : 'button-secondary'}" type="submit"
                            th:text="${user.active ? #messages.msg('admin.suspend') : #messages.msg('admin.reactivate')}"></button>
                </form>
                <span th:if="${user.role.name() == 'ADMIN'}" th:text="#{admin.adminOutOfBand}">Administrator access is managed out of band.</span>
            </td>
        </tr>
        </tbody>
    </table>
    <nav th:if="${users.totalPages > 1}" th:aria-label="#{admin.accountPages}">
        <a th:if="${users.hasPrevious()}" th:href="@{/admin/users(page=${users.number - 1})}" th:text="#{common.previous}">Previous</a>
        <span><span th:text="#{common.page}">Page</span> <span th:text="${users.number + 1}"></span> <span th:text="#{common.of}">of</span> <span th:text="${users.totalPages}"></span></span>
        <a th:if="${users.hasNext()}" th:href="@{/admin/users(page=${users.number + 1})}" th:text="#{common.next}">Next</a>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
