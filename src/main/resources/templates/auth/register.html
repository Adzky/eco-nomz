<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{auth.register.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="auth-layout">
  <section class="auth-card">
    <p class="eyebrow" th:text="#{auth.register.eyebrow}">A little less waste starts here</p>
    <h1 th:text="#{auth.register.title}">Create your account</h1>
    <p class="page-intro" th:text="#{auth.register.intro}">Choose how you want to use Eco-Nomz: find great food or share your restaurant's surplus.</p>
    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <fieldset aria-describedby="account-type-error">
            <legend th:text="#{auth.register.accountType}">Account type</legend>
            <div>
                <input id="customer" type="radio" th:field="*{accountType}" value="CUSTOMER" required>
                <label for="customer" th:text="#{auth.register.customer}">Customer — discover and reserve surplus food</label>
            </div>
            <div>
                <input id="restaurantOwner" type="radio" th:field="*{accountType}" value="RESTAURANT_OWNER">
                <label for="restaurantOwner" th:text="#{auth.register.owner}">Restaurant — publish offers and manage reservations</label>
            </div>
            <p id="account-type-error" class="field-error" th:if="${#fields.hasErrors('accountType')}" th:errors="*{accountType}"></p>
        </fieldset>
        <div>
            <label for="name" th:text="#{common.name}">Name</label>
            <input id="name" type="text" th:field="*{name}" autocomplete="name" required maxlength="120"
                   aria-describedby="name-error"
                   th:attr="aria-invalid=${#fields.hasErrors('name')}">
            <p id="name-error" class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div>
            <label for="email" th:text="#{common.email}">Email</label>
            <input id="email" type="email" th:field="*{email}" autocomplete="email" required maxlength="320"
                   aria-describedby="email-error"
                   th:attr="aria-invalid=${#fields.hasErrors('email')}">
            <p id="email-error" class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>
        <div>
            <label for="password" th:text="#{common.password}">Password</label>
            <input id="password" type="password" th:field="*{password}" autocomplete="new-password"
                   required minlength="12" maxlength="72" aria-describedby="password-help password-error"
                   th:attr="aria-invalid=${#fields.hasErrors('password')}">
            <p id="password-help" class="field-hint" th:text="#{auth.register.passwordHelp}">Use at least 12 characters for a stronger password.</p>
            <p id="password-error" class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>
        <button class="button" type="submit" th:text="#{auth.register.submit}">Create account</button>
    </form>
    <p class="auth-switch"><span th:text="#{auth.register.existing}">Already registered?</span> <a th:href="@{/login}" th:text="#{auth.login.submit}">Sign in</a></p>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
