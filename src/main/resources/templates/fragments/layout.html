<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f3">
    <title th:text="${title} + ' | ' + #{brand.name}">Eco-Nomz</title>
    <link rel="icon" type="image/png" th:href="@{/economz-symbol.png}">
    <link rel="stylesheet" th:href="@{/css/marketplace.css}">
</head>
<body>
<header class="site-header" th:fragment="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}" th:aria-label="#{nav.home}">
            <img class="brand-logo brand-logo-horizontal" th:src="@{/economz-logo-horizontal.png}" alt="">
            <img class="brand-logo brand-logo-symbol" th:src="@{/economz-symbol.png}" alt="Eco-Nomz">
        </a>
        <nav class="primary-nav" th:aria-label="#{nav.mainNavigation}">
            <a th:href="@{/offers}" th:text="#{nav.explore}">Explore offers</a>
            <a th:href="@{/restaurants}" th:text="#{nav.restaurants}">Restaurants</a>
            <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/customer/orders}" th:text="#{nav.reservations}">My reservations</a>
            <a sec:authorize="hasRole('RESTAURANT_OWNER')" th:href="@{/owner/restaurant}" th:text="#{nav.myRestaurants}">My restaurants</a>
            <a sec:authorize="hasRole('RESTAURANT_OWNER')" th:href="@{/owner/offers}" th:text="#{nav.myOffers}">My offers</a>
            <a sec:authorize="hasRole('RESTAURANT_OWNER')" th:href="@{/owner/orders}" th:text="#{nav.ownerReservations}">Reservations</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" th:text="#{nav.admin}">Admin</a>
        </nav>
        <div class="header-actions">
            <a class="header-link" sec:authorize="isAnonymous()" th:href="@{/login}" th:text="#{nav.signIn}">Sign in</a>
            <a class="button button-small" sec:authorize="isAnonymous()" th:href="@{/register}" th:text="#{nav.join}">Join Eco-Nomz</a>
            <a class="header-link" sec:authorize="hasRole('CUSTOMER')" th:href="@{/customer}" th:text="#{nav.account}">My account</a>
            <a class="header-link" sec:authorize="hasRole('RESTAURANT_OWNER')" th:href="@{/owner}" th:text="#{nav.workspace}">Workspace</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="button-quiet" type="submit" th:text="#{nav.signOut}">Sign out</button>
            </form>
            <div class="language-switch" role="group" th:aria-label="#{nav.chooseLanguage}">
                <a th:href="@{/language(lang='id',returnTo=${currentUrl})}"
                   th:classappend="${#locale.language == 'id' ? ' language-active' : ''}"
                   th:attr="aria-current=${#locale.language == 'id' ? 'true' : null}"
                   th:text="#{nav.indonesian}">Bahasa Indonesia</a>
                <span aria-hidden="true">|</span>
                <a th:href="@{/language(lang='en',returnTo=${currentUrl})}"
                   th:classappend="${#locale.language == 'en' ? ' language-active' : ''}"
                   th:attr="aria-current=${#locale.language == 'en' ? 'true' : null}"
                   th:text="#{nav.english}">English</a>
            </div>
        </div>
    </div>
</header>
<footer class="site-footer" th:fragment="footer">
    <div class="footer-inner">
        <a class="brand footer-brand" th:href="@{/}" th:aria-label="#{nav.home}">
            <img class="brand-logo brand-logo-horizontal" th:src="@{/economz-logo-horizontal.png}" alt="">
        </a>
        <p th:text="#{footer.tagline}">Good food deserves a good home. Rescue surplus, support local restaurants.</p>
    </div>
</footer>
</body>
</html>
