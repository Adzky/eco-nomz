<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${offer.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page-container">
    <p class="breadcrumb"><a th:href="@{/offers}" th:text="'← ' + #{offer.back}">← Back to all offers</a></p>
    <p th:if="${successMessage}" th:text="${#messages.msgOrNull(successMessage) != null ? #messages.msg(successMessage) : successMessage}" role="status"></p>
    <p th:if="${errorMessage}" th:text="${#messages.msgOrNull(errorMessage) != null ? #messages.msg(errorMessage) : errorMessage}" role="alert"></p>
    <div class="detail-layout">
        <section class="detail-main">
            <div class="offer-art offer-art-large" aria-hidden="true"><span th:text="#{offer.savedFood}">Good food, saved from waste</span></div>
            <p class="eyebrow" th:text="#{offer.localFavorite}">A local favorite</p>
            <h1 th:text="${offer.title}"></h1>
            <p class="detail-restaurant"><span th:text="#{offer.from}">From</span> <a th:href="@{/restaurants/{id}(id=${offer.restaurant.id})}"
                th:text="${offer.restaurant.name}"></a></p>
            <p class="detail-description" th:if="${offer.description != null}" th:text="${offer.description}"></p>
            <div class="detail-facts">
                <p><span th:text="#{offer.available}">Available</span><strong th:text="#{common.portions(${offer.quantityAvailable})}"></strong></p>
                <p><span th:text="#{offer.pickupWindow}">Pickup window</span><strong><time th:text="${#temporals.format(offer.pickupStart, 'd MMM yyyy, HH:mm')}"></time>
                    – <time th:text="${#temporals.format(offer.pickupEnd, 'HH:mm')}"></time> <span th:text="#{common.wib}">WIB</span></strong></p>
                <p><span th:text="#{common.restaurant}">Restaurant</span><strong><address th:text="${offer.restaurant.address}"></address></strong></p>
            </div>
        </section>
        <aside class="reservation-panel">
            <p class="eyebrow" th:text="#{offer.yourMeal}">Your rescued meal</p>
            <p class="detail-price">
                <del th:text="${'Rp ' + #numbers.formatDecimal(offer.originalPrice, 1, 'POINT', 0, 'COMMA')}"></del>
                <strong th:text="${'Rp ' + #numbers.formatDecimal(offer.discountedPrice, 1, 'POINT', 0, 'COMMA')}"></strong>
                <span th:text="#{offer.perPortion}">per portion</span>
            </p>
            <p class="detail-savings" th:text="#{offer.saveAmount(${#numbers.formatDecimal(offer.originalPrice - offer.discountedPrice, 1, 'POINT', 0, 'COMMA')})}"></p>
            <section sec:authorize="hasRole('CUSTOMER')">
                <h2 th:text="#{offer.reserveHeading}">Reserve this offer</h2>
        <form th:action="@{/customer/orders}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="offerId" th:value="${offer.id}">
                    <label for="quantity" th:text="#{common.quantity}">Quantity</label>
                    <input id="quantity" name="quantity" type="number" min="1"
                           th:attr="max=${offer.quantityAvailable}" value="1" required>
                    <button class="button" type="submit" th:text="#{offer.reserve}">Reserve this offer</button>
                </form>
                <p class="reassurance" th:text="#{offer.notPaid}">Your reservation is not paid until checkout is completed.</p>
            </section>
            <p sec:authorize="isAnonymous()" class="sign-in-prompt">
                <a class="button" th:href="@{/login}" th:text="#{offer.signInReserve}">Sign in to reserve</a>
                <span><span th:text="#{offer.newHere}">New here?</span> <a th:href="@{/register}" th:text="#{offer.createAccount}">Create an account</a></span>
            </p>
        </aside>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
