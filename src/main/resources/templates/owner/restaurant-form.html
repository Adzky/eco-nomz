<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${restaurantId == null ? #messages.msg('owner.restaurantForm.add') : #messages.msg('owner.restaurantForm.edit')})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page-container">
  <div class="form-layout">
    <p class="breadcrumb"><a th:href="@{/owner/restaurant}" th:text="'← ' + #{owner.restaurantForm.back}">← Back to your restaurants</a></p>
    <section class="form-card">
    <p class="eyebrow" th:text="#{owner.restaurantForm.eyebrow}">Restaurant profile</p>
    <h1 th:text="${restaurantId == null ? #messages.msg('owner.restaurantForm.add') : #messages.msg('owner.restaurantForm.edit')}"></h1>
    <p class="page-intro" th:text="#{owner.restaurantForm.intro}">Share the details customers need to find your restaurant and collect their orders.</p>
    <p class="form-help" th:if="${restaurantId == null}" th:text="#{owner.restaurantForm.logoToolNote}">
        Save restaurant details first, then upload or replace its logo.
    </p>
    <p class="form-help" th:if="${restaurantId != null}">
        <img th:if="${restaurantForm.logoUrl != null}" class="restaurant-logo" th:src="${restaurantForm.logoUrl}" alt="">
        <a th:href="@{/owner/restaurant/{id}/logo/crop(id=${restaurantId})}" th:text="#{owner.restaurantForm.logoTool}">Upload a square restaurant logo</a>
    </p>
    <form th:action="${restaurantId == null ? '/owner/restaurant' : '/owner/restaurant/update'}"
          th:object="${restaurantForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input th:if="${restaurantId != null}" type="hidden" name="id" th:value="${restaurantId}">
        <p class="field-error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>
        <div>
            <label for="name" th:text="#{owner.restaurantForm.name}">Restaurant name</label>
            <input id="name" type="text" th:field="*{name}" required maxlength="160"
                   aria-describedby="name-error" th:attr="aria-invalid=${#fields.hasErrors('name')}">
            <p id="name-error" class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div>
            <label for="description" th:text="#{owner.restaurantForm.description}">Description</label>
            <textarea id="description" th:field="*{description}" maxlength="10000"
                      aria-describedby="description-error" th:attr="aria-invalid=${#fields.hasErrors('description')}"></textarea>
            <p id="description-error" class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
        </div>
        <div>
            <label for="address" th:text="#{owner.restaurantForm.address}">Address</label>
            <textarea id="address" th:field="*{address}" required maxlength="500"
                      aria-describedby="address-error" th:attr="aria-invalid=${#fields.hasErrors('address')}"></textarea>
            <p id="address-error" class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
        </div>
        <div>
            <label for="latitude" th:text="#{owner.restaurantForm.latitude}">Latitude (optional)</label>
            <input id="latitude" type="number" step="0.000001" min="-90" max="90" th:field="*{latitude}"
                   aria-describedby="latitude-error" th:attr="aria-invalid=${#fields.hasErrors('latitude')}">
            <p id="latitude-error" class="field-error" th:if="${#fields.hasErrors('latitude')}" th:errors="*{latitude}"></p>
        </div>
        <div>
            <label for="longitude" th:text="#{owner.restaurantForm.longitude}">Longitude (optional)</label>
            <input id="longitude" type="number" step="0.000001" min="-180" max="180" th:field="*{longitude}"
                   aria-describedby="longitude-error" th:attr="aria-invalid=${#fields.hasErrors('longitude')}">
            <p id="longitude-error" class="field-error" th:if="${#fields.hasErrors('longitude')}" th:errors="*{longitude}"></p>
        </div>
        <div th:if="${restaurantId != null and restaurantForm.logoUrl == null}" class="form-help"
             th:text="#{owner.restaurantForm.logoRequired}">
            Upload a square logo to enable publishing.
        </div>
        <div th:if="${restaurantId != null and restaurantForm.logoUrl != null}">
            <input id="published" type="checkbox" th:field="*{published}">
            <label for="published" th:text="#{owner.restaurantForm.publish}">Publish this profile publicly</label>
        </div>
        <button class="button" type="submit" th:text="#{owner.restaurantForm.save}">Save restaurant</button>
    </form>
    </section>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
