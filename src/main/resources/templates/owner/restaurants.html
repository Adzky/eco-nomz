<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{owner.restaurants.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page-container">
    <div class="page-heading">
        <div><p class="eyebrow" th:text="#{owner.workspace}">Restaurant workspace</p><h1 th:text="#{owner.restaurants.title}">Your restaurants</h1>
            <p th:text="#{owner.restaurants.intro}">Keep your profile up to date so customers know where to collect their orders.</p></div>
        <a class="button" th:href="@{/owner/restaurant/edit}" th:text="#{owner.restaurants.add}">Add a restaurant</a>
    </div>
    <p th:if="${successMessage}" th:text="${#messages.msgOrNull(successMessage) != null ? #messages.msg(successMessage) : successMessage}" role="status"></p>
    <p class="empty-state" th:if="${#lists.isEmpty(restaurants)}">
        <span th:text="#{owner.restaurants.empty}">You have not added a restaurant yet. Create your profile to start sharing surplus food.</span>
        <a th:href="@{/owner/restaurant/edit}" th:text="#{owner.restaurants.addFirst}">Add your first restaurant</a>
    </p>
    <ul class="management-list" th:unless="${#lists.isEmpty(restaurants)}">
        <li th:each="restaurant : ${restaurants}">
            <div class="management-item-main">
                <img th:if="${restaurant.logoUrl != null}" class="restaurant-logo" th:src="${restaurant.logoUrl}" th:alt="${restaurant.name}">
                <a class="management-title" th:href="@{/owner/restaurant/edit(id=${restaurant.id})}" th:text="${restaurant.name}"></a>
                <address th:text="${restaurant.address}"></address>
            </div>
            <span class="status-badge" th:classappend="${!restaurant.published ? ' status-muted' : ''}"
                  th:text="${restaurant.published ? #messages.msg('common.published') : #messages.msg('common.draft')}"></span>
            <form th:action="@{/owner/restaurant/{id}/delete(id=${restaurant.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="button-secondary" type="submit" th:text="#{owner.restaurants.delete}">Delete</button>
            </form>
        </li>
    </ul>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
